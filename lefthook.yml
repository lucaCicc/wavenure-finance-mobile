pre-commit:
    parallel: true
    commands:
        lint:
            glob: '**/*.{js,ts,jsx,tsx}'
            run: pnpm eslint --fix {staged_files}
            stage_fixed: true
        prettier:
            glob: '**/*.{js,ts,jsx,tsx,json,md}'
            run: pnpm prettier --write {staged_files}
            stage_fixed: true
        types:
            glob: '**/*.{ts,tsx}'
            run: pnpm tsc --project tsconfig.json --noEmit
commit-msg:
    commands:
        commitlint:
            run: npx commitlint --edit {1}
